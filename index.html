<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STGbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<aside id="side"><div class="sbtn"><button class="o" id="made" data-ic="box" data-t="만든 것"></button><button class="o" id="cmode" data-ic="code" data-t="코드 모드"></button></div><div class="sh"><span>기록</span><button class="ib" id="sideT" data-ic="panel" aria-label="기록창 접기/펴기"></button></div><div id="sl"></div></aside>
<div class="main">
<header><b>STG<span>bot</span></b><div class="hb"><button class="o" id="lang" data-ic="globe" aria-label="언어"></button><button class="o" id="res" data-ic="flask" data-t="연구" aria-label="연구"></button><button class="o" id="share" data-ic="share" aria-label="공유"></button><button class="o" id="new" data-ic="chatplus" data-t="새 채팅"></button></div></header>
<div class="tools"><button class="o" id="info" data-ic="lock" data-t="정보 입수"></button><button class="o" id="login" data-ic="user" data-t="STG 로그인"></button></div>
<div id="log">
<div class="welcome" id="welcome">
<h2 id="wh">STGbot이랑 게임 하실래요?</h2>
<p>궁금한 걸 자유롭게 물어보세요</p>

</div>
</div>
<div id="board"></div>
<div class="foot">
<div class="tray" id="tray"></div>
<div class="menu" id="menu"><button class="o" data-k="cam" data-ic="camera" data-t="카메라"></button><button class="o" data-k="pho" data-ic="image" data-t="사진"></button><button class="o" data-k="fil" data-ic="file" data-t="파일"></button></div>

<div class="bar"><button class="rb" id="plus" data-ic="plus"></button><button class="o" id="mdl"></button><textarea id="in" rows="1" placeholder="메시지를 입력하세요"></textarea><button class="rb" id="mic" data-ic="mic" aria-label="음성 입력"></button><button class="rb" id="vc" data-ic="wave" aria-label="음성 대화"></button><button id="go">전송</button></div>
</div>
</div>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pho" accept="image/*" multiple hidden>
<input type="file" id="fil" accept="image/*,.txt,.md,.csv,.json,.html,.css,.js,.py,.xml,.log" multiple hidden>
<div id="dlg"></div>
<div id="toast"></div>
<script>
Promise.all(['app1.js','app2.js'].map(u=>fetch(u).then(r=>{if(!r.ok)throw u;return r.text()}))).then(t=>{const s=document.createElement('script');s.text=t.join('');document.body.appendChild(s)}).catch(u=>{document.body.insertAdjacentHTML('afterbegin','<p style="color:#fff;padding:16px">파일을 불러오지 못했어요: '+u+'</p>')});
</script>
</body>
</html>
