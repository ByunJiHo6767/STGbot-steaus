<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STGbot</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#161514;--text:#f3f0ea;--muted:#9a968e;--line:#34312d;--accent:#dd8a62;--accent-t:#1d1008;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000}
body{color:var(--text);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
svg{display:block;flex:none}
.wrap{max-width:980px;margin:0 auto;height:100%;display:flex}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
#side{width:96px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .sh{padding:16px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;color:var(--muted)}
#sl{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (min-width:640px){#side{width:260px}#side .sh{padding:18px 16px;font-size:16px}}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
header b{font-size:24px;letter-spacing:-.5px}header b span{color:var(--accent)}
.o{display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 12px;font-size:14px;cursor:pointer}
.o:active,.ib:active,.rb:active,.emoji button:active{transform:scale(.94)}
.o.on{border-color:var(--accent);color:var(--accent)}
header .o{color:var(--muted)}
.tools{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line)}.tools .o{flex:1}
.ib{background:none;border:0;color:var(--muted);padding:8px;border-radius:10px;display:flex;cursor:pointer}
.ib.on{color:var(--accent)}.ib:active{background:var(--card)}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.welcome{margin:auto;text-align:center;padding:16px 0}
.welcome h2{font-size:26px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips span{padding:12px 18px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:15px;cursor:pointer}
.row{display:flex;flex-direction:column;gap:2px}.row.u{align-items:flex-end}.row.a{align-items:stretch}
.msg{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--accent);color:var(--accent-t)}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.has{width:88%}
.msg img{display:block;width:100%;background:#fff;border-radius:10px;margin-bottom:8px}
.msg.stk{background:none;border:0;font-size:48px;line-height:1.2;padding:0}
.att{font-size:12px;opacity:.8;margin-top:4px}
.acts{display:flex;align-items:center;gap:2px;padding:0 2px}.acts .sp{margin-left:auto}
.more{display:none;gap:8px;flex-wrap:wrap;padding:4px 2px}.more.on{display:flex}
.more .o{padding:7px 12px;font-size:13px}
.foot{border-top:1px solid var(--line)}
.tray{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}.tray:empty{display:none}
.tray span{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer}
.menu{display:none;gap:8px;padding:8px 16px 0}.menu.on{display:flex}
.menu .o{flex:1;flex-direction:column;gap:4px;padding:12px 4px}
.emoji{display:none;padding:8px 16px 0;max-height:30vh;overflow-y:auto}
.emoji.on{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.emoji button{background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:24px;padding:6px 0;cursor:pointer}
.bar{display:flex;gap:8px;padding:12px 16px;align-items:flex-end}
.rb{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
textarea{flex:1;min-height:50px;max-height:120px;resize:none;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);font:inherit}
#go{height:50px;padding:0 22px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-t);font-weight:700;cursor:pointer}#go:disabled{opacity:.5}
#hist{display:none;position:fixed;inset:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);flex-direction:column}
#hist.on{display:flex}
#hist .hh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700}
#hl{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.hi{display:flex;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.hi.cur{border-color:var(--accent)}.hi div{flex:1;min-width:0}.hi small{color:var(--muted);display:block}
.hi b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sl .hi{padding:8px;gap:2px;border-radius:12px}
#sl .hi small{display:none}
#sl .hi b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
#sl .hi .ib{padding:2px}
@media (min-width:640px){#sl .hi{padding:12px;gap:8px}#sl .hi small{display:block}}
@media (max-width:639px){.bar{flex-wrap:wrap;padding:10px}.bar textarea{order:-1;flex:1 1 100%}#mic{margin-left:auto}#go{height:42px}.rb{width:42px;height:42px}}
.hb{display:flex;gap:6px}
header .o{padding:8px 10px;font-size:13px}
.mut{color:var(--muted);margin:0 0 12px}
#board{display:none;flex:1;min-height:0;overflow-y:auto;padding:16px}
body.bd #board{display:block}
body.bd #log,body.bd .foot{display:none}
.inp{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit}
.bt{display:flex;gap:8px;margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px;margin-bottom:12px}
.ch{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.ch input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid transparent;color:var(--text);font:inherit;font-weight:700;font-size:17px;padding:4px 2px}
.ch input:focus{outline:none;border-bottom-color:var(--accent)}
.it{display:flex;align-items:flex-start;gap:2px;margin-bottom:6px}
.it textarea{min-height:0;max-height:none;overflow:hidden;padding:7px 10px;border-radius:10px;font-size:15px;line-height:1.5;background:var(--bg)}
.add{display:flex;gap:6px;align-items:center;margin-top:8px}
#side .sh{display:flex;align-items:center;justify-content:space-between;gap:4px}
#side.c{width:48px}
#side.c .sh{justify-content:center;padding:16px 4px}
#side.c .sh span,#side.c #sl{display:none}
#research{display:none;flex:1;min-height:0;overflow-y:auto;padding:16px}
body.rs #research{display:block}
body.rs #log,body.rs .foot,body.rs #board{display:none}
.rt{display:flex;gap:8px;margin-bottom:14px}
.racts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rsec h4{margin:0 0 6px;font-size:15px;color:var(--accent)}
.rsec p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.lock{max-width:320px;margin:40px auto;text-align:center}
.lock h3{margin:0 0 14px}
.lock .inp{width:100%;margin-bottom:10px;text-align:center}
.lock .o{width:100%}
.tools{flex-wrap:wrap}
.tools .o{flex:1 1 auto;white-space:nowrap}
#dlg{display:none;position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#dlg .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:320px;text-align:center}
#dlg h3{margin:0 0 6px}
#dlg p{margin:0 0 12px;color:var(--muted);font-size:14px}
#dlg .inp{width:100%;margin-bottom:10px;text-align:center}
#dlg .o{width:100%;margin-top:6px}
.rb.on{border-color:var(--accent);color:var(--accent);animation:pl 1.2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(221,138,98,.5)}70%{box-shadow:0 0 0 10px rgba(221,138,98,0)}100%{box-shadow:0 0 0 0 rgba(221,138,98,0)}}
@media (max-width:639px){#new span,#lang span,#res span{display:none}header b{font-size:20px}.hb{gap:4px}header{padding:12px}header .o{padding:8px}}
.bar #mdl{height:50px;padding:0 14px;border-radius:25px;flex:none}
@media (max-width:639px){.bar #mdl{height:42px;padding:0 12px}}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#dlg .seg .o{width:auto;margin-top:0;flex:1;padding:10px 6px;font-size:14px}
.sbtn{display:flex;flex-direction:column;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.sbtn .o{padding:8px 6px;font-size:12px;gap:4px;justify-content:flex-start}
#side.c .sbtn .o span{display:none}
#side.c .sbtn .o{justify-content:center;padding:8px 0}
@media (min-width:640px){.sbtn .o{font-size:14px;padding:9px 12px;gap:8px}}
.tx{white-space:pre-wrap;word-break:break-word}
.code{background:#0b0b0b;border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden;text-align:left}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.ch2{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 2px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
#dlg .bx.wide{max-width:560px;max-height:82vh;overflow-y:auto;text-align:left}
#dlg .bx.wide h3{text-align:center}
.mimg{display:block;width:100%;background:#fff;border-radius:10px;margin:0 0 10px}
.mitem{position:relative;margin:0 0 10px}
.mitem .mimg{margin:0}
.mitem .mdel{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:6px}
.mitem.c .mdel{top:1px;right:40px;background:none;color:var(--muted);padding:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
</style>
</head>
<body>
<div class="wrap">
<aside id="side"><div class="sbtn"><button class="o" id="made" data-ic="box" data-t="만든 것"></button><button class="o" id="cmode" data-ic="code" data-t="코드 모드"></button></div><div class="sh"><span>기록</span><button class="ib" id="sideT" data-ic="panel" aria-label="기록창 접기/펴기"></button></div><div id="sl"></div></aside>
<div class="main">
<header><b>STG<span>bot</span></b><div class="hb"><button class="o" id="lang" data-ic="globe" aria-label="언어"></button><button class="o" id="res" data-ic="flask" data-t="연구" aria-label="연구"></button><button class="o" id="share" data-ic="share" aria-label="공유"></button><button class="o" id="new" data-ic="chatplus" data-t="새 채팅"></button></div></header>
<div class="tools"><button class="o" id="info" data-ic="lock" data-t="정보 입수"></button><button class="o" id="login" data-ic="user" data-t="STG 로그인"></button></div>
<div id="log">
<div class="welcome" id="welcome">
<h2 id="wh">STGbot이랑 게임 하실래요?</h2>
<p>궁금한 걸 자유롭게 물어보세요</p>

</div>
</div>
<div id="board"></div>
<div class="foot">
<div class="tray" id="tray"></div>
<div class="menu" id="menu"><button class="o" data-k="cam" data-ic="camera" data-t="카메라"></button><button class="o" data-k="pho" data-ic="image" data-t="사진"></button><button class="o" data-k="fil" data-ic="file" data-t="파일"></button></div>

<div class="bar"><button class="rb" id="plus" data-ic="plus"></button><button class="o" id="mdl"></button><textarea id="in" rows="1" placeholder="메시지를 입력하세요"></textarea><button class="rb" id="mic" data-ic="mic" aria-label="음성 입력"></button><button class="rb" id="vc" data-ic="wave" aria-label="음성 대화"></button><button id="go">전송</button></div>
</div>
</div>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pho" accept="image/*" multiple hidden>
<input type="file" id="fil" accept="image/*,.txt,.md,.csv,.json,.html,.css,.js,.py,.xml,.log" multiple hidden>
<div id="dlg"></div>
<div id="toast"></div>
<script>
// ===== 독립 실행용 AI 연결 (Claude 화면 밖에서 쓰기 위한 부분) =====
// server.js를 같은 주소에서 실행하면 '/api/chat' 그대로 두면 됩니다.
// 서버를 다른 주소에 두었다면 그 주소로 바꾸세요. 예: 'https://내서버.com/api/chat'
const API_URL='/api/chat';
const blobB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const _sample=async(input,o={})=>{
  if(!API_URL)throw{code:'none'};
  const messages=typeof input==='string'?[{role:'user',content:input}]:input;
  const images=o.images?await Promise.all(o.images.map(async b=>({d:await blobB64(b),t:b.type||'image/jpeg'}))):[];
  let r;try{r=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages,images,tier:o.modelTier||'default',effort:o.effort||'medium'})})}catch(e){throw{code:'none'}}
  if(r.status===429)throw{code:'rate_limited'};
  const j=await r.json().catch(()=>({}));
  if(!r.ok||typeof j.text!=='string')throw{code:'err'};
  if(o.onText)o.onText({text:j.text});
  return{text:j.text};
};
_sample.limits=async()=>({images:true});
const claude={use:async()=>_sample};
// ===== 여기까지 =====

const $=id=>document.getElementById(id),log=$('log'),inp=$('in'),go=$('go'),W=$('welcome'),tray=$('tray');
const P={
up:'<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
down:'<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>',
regen:'<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
vol:'<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>',
panel:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
unlock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
box:'<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
code:'<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
cpu:'<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',
globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
wave:'<path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/>',
user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
chatplus:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/>',
flask:'<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
edit:'<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/>',
camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
share:'<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4M12 2v13"/>',
branch:'<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>'};
const ic=(n,s=20)=>'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>';

const DD={en:{},ja:{}};T.forEach(r=>{DD.en[r[0]]=r[1];DD.ja[r[0]]=r[2]});
const PT=[[/^(.+) · 하$/,'$1 · Low','$1 · 低'],[/^(.+) · 중$/,'$1 · Med','$1 · 中'],[/^(.+) · 높음$/,'$1 · High','$1 · 高'],[/^(.+) · 최대$/,'$1 · Max','$1 · 最大'],[/^(.+) · 빠름$/,'$1 · Fast','$1 · 高速'],[/^(.+) · 기본$/,'$1 · Default','$1 · 標準'],[/^(.+) · 정밀$/,'$1 · Precise','$1 · 高精度'],[/^(\d+)개 메시지$/,'$1 messages','$1件のメッセージ'],[/^(.+) 로그인했어요$/,'$1 logged in','$1 でログインしました']];
const tr=s=>{if(lang==='ko')return s;const d=DD[lang],t=s.trim();if(d[t])return s.replace(t,d[t]);for(const p of PT){if(p[0].test(t))return s.replace(t,t.replace(p[0],lang==='en'?p[1]:p[2]))}return s};
const orig=new WeakMap(),oattr=new WeakMap(),AT=['placeholder','aria-label','title'];
let raf=0;
const obs=new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(apply)});
function apply(){
  obs.disconnect();
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){
    const p=n.parentElement;if(!p||p.closest('.msg,textarea,script,style'))continue;
    let o=orig.get(n);if(o===undefined){o=n.nodeValue;orig.set(n,o)}
    const v=tr(o);if(n.nodeValue!==v)n.nodeValue=v;
  }
  document.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>{
    let m=oattr.get(e);if(!m){m={};oattr.set(e,m)}
    AT.forEach(a=>{if(!e.hasAttribute(a))return;const cur=e.getAttribute(a);
      if(m[a]===undefined||cur!==m[a+'t'])m[a]=cur;
      const v=tr(m[a]);m[a+'t']=v;if(cur!==v)e.setAttribute(a,v)});
  });
  obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:AT});
}
const setLangBtn=()=>{$('lang').innerHTML=ic('globe')+'<span>'+lang.toUpperCase()+'</span>'};
function openLang(){
  const D2=$('dlg'),b=el('div','bx'),close=el('button','o','닫기');D2.innerHTML='';
  close.onclick=()=>D2.classList.remove('on');
  b.append(el('h3',null,'Language'));
  Object.keys(LANGS).forEach(k=>{const x=el('button','o'+(k===lang?' on':''),LANGS[k].n);x.onclick=()=>{lang=k;try{localStorage.setItem('stg-lang',k)}catch(e){}document.documentElement.lang=k;setLangBtn();pickMsg();apply();D2.classList.remove('on')};b.appendChild(x)});
  b.appendChild(close);D2.appendChild(b);D2.classList.add('on');
}
$('lang').onclick=openLang;
